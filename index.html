<style>

    --edge: #C9D4E0; --hl: rgba(255, 220, 80, .5);

    --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #0F151D; --paper: #18212D; --grid: #2D3E53; --margin: #94444D;
      --ink-x: #86A9FF; --ink-o: #FF8576; --text: #E2E8F0; --muted: #9AA8B8;
      --edge: #2A3647; --hl: rgba(255, 214, 90, .2);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #0F151D; --paper: #18212D; --grid: #2D3E53; --margin: #94444D;
    --ink-x: #86A9FF; --ink-o: #FF8576; --text: #E2E8F0; --muted: #9AA8B8;
    --edge: #2A3647; --hl: rgba(255, 214, 90, .2);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--sans); font-size: 1rem; line-height: 1.5; }

  .layout {
    max-width: 1240px; margin: 0 auto; padding: 20px;
    display: grid; gap: 20px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "intro" "page" "controls";
  }
  @media (min-width: 860px) {
    .layout {
      grid-template-columns: minmax(260px, 300px) minmax(0, 1fr);
      grid-template-areas: "intro page" "controls page";
      grid-template-rows: auto 1fr;
      align-items: start; padding: 32px; gap: 24px 36px;
    }
  }
  .intro { grid-area: intro; }
  h1 {
    font-family: var(--hand); font-weight: 700;
    font-size: clamp(2.8rem, 7vw, 3.8rem); line-height: 1;
    color: var(--ink-x); margin: 0 0 .35rem;
    transform: rotate(-2deg); transform-origin: left center;
  }
  .rules { margin: 0 0 1.1rem; color: var(--muted); max-width: 34ch; }
  .status { font-family: var(--hand); font-size: 1.45rem; line-height: 1.3; min-height: 2.6em; margin: 0 0 .6rem; }
  .ink { font-family: var(--hand); font-weight: 700; }
  .ink-x { color: var(--ink-x); }
  .ink-o { color: var(--ink-o); }

  .score { display: flex; align-items: flex-end; gap: .9rem; font-family: var(--hand); }
  .score .side { display: grid; justify-items: center; line-height: 1.1; min-width: 4.5rem; }
  .score .mark { font-size: 1.5rem; font-weight: 700; }
  .score .num { font-size: 2.4rem; font-weight: 700; }
  .score small { font-family: var(--sans); font-size: .85rem; color: var(--muted); max-width: 9rem; text-align: center; overflow-wrap: anywhere; }
  .score .colon { font-size: 2.2rem; padding-bottom: 1.35rem; color: var(--muted); }
  .draws { font-size: .9rem; color: var(--muted); margin: .25rem 0 0; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-right: .35rem; background: var(--muted); vertical-align: middle; }
  .dot.on { background: #2E9E5B; }

  .page {
    grid-area: page; position: relative;
    background: var(--paper); border: 1px solid var(--edge);
    border-radius: 4px 14px 14px 4px;
    padding: 18px 18px 18px 46px; min-width: 0;
  }
  .page::before { content: ""; position: absolute; top: 0; bottom: 0; left: 28px; width: 2px; background: var(--margin); opacity: .75; }
  @media (max-width: 520px) {
    .layout { padding: 14px; gap: 16px; }
    .page { padding: 10px 10px 10px 28px; }
    .page::before { left: 16px; }
  }
  .board-wrap { position: relative; width: max-content; }
  .board {
    --cell: 30px; --turn-ink: var(--ink-x);
    display: grid;
    grid-template-columns: repeat(var(--n), var(--cell));
    grid-auto-rows: var(--cell);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid);
  }
  .board[data-turn="2"] { --turn-ink: var(--ink-o); }
  .cell {
    width: var(--cell); height: var(--cell); padding: 0; margin: 0; border: 0;
    background: transparent; cursor: pointer; display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .board:not(.locked) .cell:not(.filled):hover { background: color-mix(in srgb, var(--turn-ink) 13%, transparent); }
  .board.locked .cell { cursor: default; }
  .cell:focus-visible { outline: 2px solid var(--turn-ink); outline-offset: -2px; }
  .cell.last { background: var(--hl); }
  .cell.x { color: var(--ink-x); }
  .cell.o { color: var(--ink-o); }
  .cell svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .cell path {
    fill: none; stroke: currentColor; stroke-width: 9;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw .2s ease-out forwards;
  }
  .cell path.s2 { animation-delay: .16s; }
  .cell.o path { animation-duration: .32s; }
  .cell svg.still path { animation: none; stroke-dashoffset: 0; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .winline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .winline path {
    fill: none; stroke-width: .15; stroke-linecap: round; opacity: .85;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw .5s .15s ease-in-out forwards;
  }

  .controls { grid-area: controls; display: grid; gap: 1rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset[disabled] { opacity: .45; }
  legend, .label { display: block; font-weight: 700; padding: 0; margin-bottom: .35rem; font-size: .95rem; }
  .options { display: flex; flex-wrap: wrap; gap: .4rem; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opt span {
    display: inline-block; padding: .4rem .75rem;
    border: 1.5px solid var(--edge); border-radius: 8px;
    background: var(--paper); font-size: .95rem; cursor: pointer;
  }
  .opt input:checked + span { border-color: var(--ink-x); color: var(--ink-x); font-weight: 700; box-shadow: inset 0 -3px 0 var(--ink-x); }
  .opt input:focus-visible + span { outline: 2px solid var(--ink-x); outline-offset: 2px; }

  .buttons { display: flex; flex-wrap: wrap; gap: .5rem; }
  .btn {
    font: 700 1rem var(--sans); padding: .6rem 1rem; border-radius: 8px;
    border: 2px solid var(--text); background: transparent; color: var(--text); cursor: pointer;
  }
  .btn.primary { background: var(--ink-x); border-color: var(--ink-x); color: var(--paper); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .field:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; }
  .note { font-size: .85rem; color: var(--muted); margin: 0; }
  .panel { display: grid; gap: .9rem; padding: 1rem; border: 1.5px dashed var(--edge); border-radius: 10px; }
  .stack { display: grid; gap: .9rem; }
  .row { display: flex; gap: .5rem; }
  .row .field { flex: 1; min-width: 0; }
  .field {
    font: 1rem var(--sans); color: var(--text); width: 100%;
    background: var(--paper); border: 1.5px solid var(--edge); border-radius: 8px;
    padding: .55rem .7rem;
  }
  .panel-msg { font-size: .9rem; margin: 0; min-height: 1.2em; }
  .lang { display: flex; gap: .35rem; margin: 0 0 .9rem; }
  .home { display: inline-block; margin: 0 0 .7rem; font-size: .9rem; color: var(--ink-x); text-underline-offset: 3px; }
  .home:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; border-radius: 4px; }
  .lang-btn {
    font: .85rem var(--sans); padding: .25rem .7rem; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--edge); background: var(--paper); color: var(--muted);
  }
  .lang-btn[aria-pressed="true"] { border-color: var(--ink-x); color: var(--ink-x); font-weight: 700; }
  .lang-btn:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .cell path, .winline path { animation: none; stroke-dashoffset: 0; }
  }
</style>

<body>
<main class="layout">
  <header class="intro">
    <a class="home" href="../" data-i18n="allGames"></a>
    <div class="lang" role="group" aria-label="Language / Nyelv">
      <button type="button" class="lang-btn" data-lang="hu" lang="hu">Magyar</button>
      <button type="button" class="lang-btn" data-lang="en" lang="en">English</button>
    </div>
    <h1>Amőba</h1>
    <p class="rules" data-i18n="rules"></p>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="scoreBlock">
      <div class="score" data-i18n-aria="scoreAria">
        <div class="side"><span class="mark ink-x" id="mx">X</span><span class="num" id="sx">0</span><small id="lx"></small></div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="side"><span class="mark ink-o" id="mo">O</span><span class="num" id="so">0</span><small id="lo"></small></div>
      </div>
      <p class="draws" id="draws"></p>
    </div>
  </header>

  <section class="page" data-i18n-aria="boardAria">
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <svg class="winline" id="winline" aria-hidden="true" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="controls" data-i18n-aria="settingsAria">
    <fieldset>
      <legend data-i18n="legendMode"></legend>
      <div class="options">
        <label class="opt"><input type="radio" name="mode" value="ai"><span data-i18n="optAi"></span></label>
        <label class="opt"><input type="radio" name="mode" value="pvp"><span data-i18n="optPvp"></span></label>
        <label class="opt"><input type="radio" name="mode" value="online"><span data-i18n="optOnline"></span></label>
        <label class="opt"><input type="radio" name="mode" value="msg"><span data-i18n="optMsg"></span></label>
      </div>
    </fieldset>

    <div class="panel" id="onlinePanel" hidden>
      <div>
        <label class="label" for="myName" data-i18n="yourName"></label>
        <input class="field" id="myName" maxlength="24" autocomplete="nickname" data-i18n-ph="namePh">
      </div>
      <div id="lobby" class="stack">
        <p class="note" data-i18n="lobbyNote"></p>
        <button class="btn primary" id="inviteBtn" type="button" data-i18n="inviteBtn"></button>
      </div>
      <div id="ingame" class="stack" hidden>
        <div id="inviteBox" class="stack">
          <div>
            <label class="label" for="inviteLink" data-i18n="inviteLink"></label>
            <div class="row">
              <input class="field" id="inviteLink" readonly>
              <button class="btn primary" id="shareBtn" type="button" data-i18n="share"></button>
            </div>
          </div>
        </div>
        <p class="note" id="connLine"></p>
        <div class="buttons">
          <button class="btn primary" id="againBtn" type="button" data-i18n="playAgain" hidden></button>
          <button class="btn" id="leaveBtn" type="button"></button>
        </div>
      </div>
      <p class="panel-msg" id="onNote" aria-live="polite"></p>
    </div>

    <div class="panel" id="msgPanel" hidden>
      <p class="note" data-i18n="msgIntro"></p>
      <div id="sendBox" hidden>
        <label class="label" for="sendCode" data-i18n="sendThis"></label>
        <div class="row">
          <input class="field" id="sendCode" readonly>
          <button class="btn primary" id="copyCodeBtn" type="button" data-i18n="share"></button>
        </div>
      </div>
      <div>
        <label class="label" for="pasteCode" data-i18n="pasteLabel"></label>
        <div class="row">
          <input class="field" id="pasteCode" autocomplete="off" spellcheck="false" placeholder="amoba-15-…">
          <button class="btn" id="loadBtn" type="button" data-i18n="loadMove"></button>
        </div>
      </div>
      <p class="panel-msg" id="msgNote" aria-live="polite"></p>
    </div>

    <fieldset id="sideSet">
      <legend data-i18n="legendSide"></legend>
      <div class="options">
        <label class="opt"><input type="radio" name="human" value="1"><span data-i18n="sideX"></span></label>
        <label class="opt"><input type="radio" name="human" value="2"><span data-i18n="sideO"></span></label>
      </div>
    </fieldset>
    <fieldset id="sizeSet">
      <legend data-i18n="legendSize"></legend>
      <div class="options">
        <label class="opt"><input type="radio" name="size" value="15"><span>15 × 15</span></label>
        <label class="opt"><input type="radio" name="size" value="19"><span>19 × 19</span></label>
      </div>
    </fieldset>
    <div class="buttons">
      <button class="btn primary" id="newBtn" type="button"></button>
      <button class="btn" id="undoBtn" type="button" data-i18n="undo"></button>
      <button class="btn" id="resetBtn" type="button" data-i18n="reset"></button>
    </div>
    <p class="note" id="settingsNote"></p>
  </section>
</main>

        return;
      }
      if (conn !== NET.conn) return;
      NET.lastSeen = Date.now();
      if (msg.t === "move") {
        const { r, c, n } = msg;
        const guestMark = 3 - NET.g.hostMark;
        if (!Number.isInteger(r) || !Number.isInteger(c) || r < 0 || c < 0 || r >= S.N || c >= S.N) return sendState();
        if (n !== S.moves.length || isOver() || turn() !== guestMark || board[r][c]) return sendState();
        hostApply(r, c);
      } else if (msg.t === "again") hostAgain();
      else if (msg.t === "name") { NET.oppName = cleanName(msg.name); saveHost(); renderUI(); }
    });
    conn.on("open", () => { if (conn === NET.conn) sendState(); });
    const lost = () => { if (conn === NET.conn) { NET.conn = null; NET.connected = false; renderUI(); } };
    conn.on("close", lost);
    conn.on("error", lost);
  }
  function sendState() {
    if (!NET.conn || !NET.connected || !NET.g) return;
    const g = NET.g;
    try { NET.conn.send({ t: "state", N: g.N, moves: g.moves, round: g.round, hostMark: g.hostMark, score: g.score, name: myName() }); } catch (e) {}
  }
  function hostApply(r, c) {
    const g = NET.g;
    S.moves.push([r, c]);
    g.moves = encode(S.moves);
    recompute();
    if (isOver()) {
      const wm = winnerMark();
      if (!wm) g.score.d++; else if (wm === g.hostMark) g.score.host++; else g.score.guest++;
    }
    saveHost(); sendState(); render();
  }
  function hostAgain() {
    const g = NET.g;
    if (!g || !isOver()) return;
    g.round++; g.moves = ""; g.hostMark = 3 - g.hostMark;
    saveHost(); applyG(); sendState();
  }

  // Guest: the person who opens the invite link.
  function guestStart(code) {
    if (!peerLib()) { noPeerLib(); return; }
    leaveOnline(false);
    NET.role = "guest"; NET.code = code;
    lsSet(K.join, code);
    setHash("join-" + code);
    S.N = S.size; S.moves = []; recompute(); render();
    openGuestPeer();
  }
  function openGuestPeer() {
    if (NET.role !== "guest") return;
    destroyPeer();
    setNote(onNote, "connecting");
    const peer = new Peer({ debug: 0 });
    NET.peer = peer;
    peer.on("open", () => { if (NET.peer !== peer) return; NET.ready = true; connectToHost(); });
    peer.on("disconnected", () => {
      if (NET.peer !== peer || peer.destroyed) return;
      NET.ready = false;
      scheduleRetry(() => { if (!peer.destroyed) { try { peer.reconnect(); } catch (e) { openGuestPeer(); } } }, 3000);
    });
    peer.on("error", err => {
      if (NET.peer !== peer) return;
      if (err.type === "peer-unavailable") {
        if (!NET.connected) {
          setNote(onNote, "waitHost");
          scheduleRetry(connectToHost, 4000);
        }
      } else netError(err, openGuestPeer);
      renderUI();
    });
  }
  function connectToHost() {
    const peer = NET.peer;
    if (NET.role !== "guest" || NET.full || NET.connected) return;
    if (!peer || peer.destroyed) { openGuestPeer(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} scheduleRetry(connectToHost, 3000); return; }
    if (NET.pendingConn) { try { NET.pendingConn.close(); } catch (e) {} }
    const conn = peer.connect(PEER_PREFIX + NET.code, { reliable: true });
    NET.pendingConn = conn;
    const giveUp = setTimeout(() => {
      if (NET.pendingConn === conn && !NET.connected) {
        NET.pendingConn = null;
        try { conn.close(); } catch (e) {}
        scheduleRetry(connectToHost, 2000);
      }
    }, 12000);
    conn.on("open", () => {
      clearTimeout(giveUp);
      if (NET.pendingConn !== conn) { try { conn.close(); } catch (e) {} return; }
      NET.pendingConn = null; NET.conn = conn; NET.connected = true; NET.lastSeen = Date.now();
      setNote(onNote, "");
      try { conn.send({ t: "hello", token: myToken(), name: myName() }); } catch (e) {}
      renderUI();
    });
    conn.on("data", msg => {
      if (conn !== NET.conn || !msg || typeof msg !== "object") return;
      NET.lastSeen = Date.now();
      guestData(msg);
    });
    const lost = () => { clearTimeout(giveUp); if (conn === NET.conn) guestLost(); };
    conn.on("close", lost);
    conn.on("error", lost);
  }
  function guestLost() {
    NET.conn = null; NET.connected = false; NET.pending = false;
    renderUI();
    if (NET.role === "guest" && !NET.full) {
      setNote(onNote, "lost");
      scheduleRetry(connectToHost, 2000);
    }
  }
  function guestData(msg) {
    if (msg.t === "state") {
      NET.g = validG(msg);
      NET.oppName = cleanName(msg.name);
      NET.pending = false;
      if (["connecting", "waitHost", "lost"].includes(noteKey(onNote))) setNote(onNote, "");
      applyG();
    } else if (msg.t === "full") {
      NET.full = true;
      setNote(onNote, "fullNote");
      renderUI();
    } else if (msg.t === "bye") {
      leaveOnline(true);
      setNote(onNote, "bye");
      renderUI();
    }
  }

  function onlineMove(r, c) {
    if (NET.role === "host") { hostApply(r, c); return; }
    NET.pending = true;
    try { NET.conn.send({ t: "move", r, c, n: S.moves.length }); } catch (e) { NET.pending = false; }
    setTimeout(() => { if (NET.pending) { NET.pending = false; renderUI(); } }, 6000);
    renderUI();
  }
  function playAgain() {
    if (NET.role === "host") hostAgain();
    else if (NET.conn) { try { NET.conn.send({ t: "again" }); } catch (e) {} }
  }

  // Keep-alive: notice dropped connections, especially on phones.
  setInterval(() => {
    if (!NET.conn || !NET.connected) return;
    try { NET.conn.send({ t: "ping" }); } catch (e) {}
    if (Date.now() - NET.lastSeen > 15000) {
      const c = NET.conn;
      if (NET.role === "host") { NET.conn = null; NET.connected = false; renderUI(); }
      else guestLost();
      try { c.close(); } catch (e) {}
    }
  }, 4000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (NET.role === "guest" && !NET.connected && !NET.full) { clearTimeout(NET.retry); connectToHost(); }
    if (NET.role === "host") {
      if (!NET.peer || NET.peer.destroyed) openHostPeer();
      else if (NET.peer.disconnected) { try { NET.peer.reconnect(); } catch (e) {} }
    }
  });

  async function shareOrCopy(text, url, input, noteEl) {
    if (navigator.share) {
      try { await navigator.share(url ? { title: "Amőba", text, url } : { title: "Amőba", text }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const full = url ? `${text} ${url}` : text;
    try {
      await navigator.clipboard.writeText(full);
      setNote(noteEl, "copied");
    } catch (e) {
      input.focus(); input.select();
      setNote(noteEl, "copyBlocked");
    }
  }

  // ---------- mode switching ----------
  function enterOnline() {
    S.N = S.size; S.moves = []; recompute(); render();
    let saved = null;
    try { saved = JSON.parse(lsGet(K.host) || "null"); } catch (e) {}
    const joined = lsGet(K.join);
    if (saved && typeof saved.code === "string" && /^[a-z2-9]{6}$/.test(saved.code)) hostStart(saved);
    else if (joined && /^[a-z2-9]{6}$/.test(joined)) guestStart(joined);
  }
  function setMode(m) {
    if (S.mode === m) return;
    clearTimeout(aiTimer); aiTimer = null;
    if (S.mode === "online") leaveOnline(false);
    S.mode = m; save();
    setNote(onNote, ""); setNote(msgNote, "");
    if (m === "ai" || m === "pvp") newLocalGame();
    else if (m === "msg") enterMsg();
    else enterOnline();
  }

  // ---------- UI ----------
  function oppLabel(capital) {
    if (NET.oppName) return esc(NET.oppName);
    return t(capital ? "oppCap" : "opp");
  }
  function statusHTML() {
    const tn = turn(), wm = winnerMark(), over = isOver();
    switch (S.mode) {
      case "ai":
        if (over) return wm ? (wm === S.human ? t("winFive", ink(wm)) : t("compWins")) : t("draw");
        if (aiTimer) return t("thinking");
        return t("yourMove", ink(S.human));
      case "pvp":
        if (over) return wm ? t("wins", ink(wm)) : t("draw");
        return t("toMove", ink(tn));
      case "msg":
        if (over) return (wm ? t("wins", ink(wm)) : t("draw")) + (S.msg.waiting ? t("sendLast") : "");
        if (S.msg.waiting) return t("msgWaiting");
        if (!S.moves.length) return t("msgFirst", ink(1));
        return t("msgYourMove", ink(tn));
      case "online": {
        if (!NET.role) return t("onNone");
        if (NET.role === "host") {
          if (!NET.ready && !NET.connected) return t("connecting");
          if (!NET.everJoined) return t("sendInvite");
        } else if (!NET.g) {
          return NET.full ? t("full") : t("connectingGame");
        }
        if (over) {
          if (!wm) return t("draw");
          return wm === myMark() ? t("onWin") : t("oppWinsRound", oppLabel(true));
        }
        if (!NET.connected) return NET.role === "host" ? t("oppOffline", oppLabel(true)) : t("reconnecting");
        if (myMark() === tn) return t("yourMove", ink(tn));
        return t("waitingFor", oppLabel(false));
      }
    }
    return "";
  }
  function setSide(markEl, mark) {
    markEl.textContent = mark === 1 ? "X" : "O";
    markEl.className = "mark " + (mark === 1 ? "ink-x" : "ink-o");
  }
  function renderUI() {
    const mode = S.mode, local = mode === "ai" || mode === "pvp";
    boardEl.dataset.turn = turn();
    boardEl.classList.toggle("locked", !canMoveNow());
    statusEl.innerHTML = statusHTML();

    const scoreBlock = $("#scoreBlock");
    if (local) {
      scoreBlock.hidden = false;
      setSide($("#mx"), 1); setSide($("#mo"), 2);
      $("#sx").textContent = S.score[1];
      $("#so").textContent = S.score[2];
      $("#draws").textContent = t("draws", S.score.d);
      const ai = mode === "ai";
      $("#lx").textContent = ai ? (S.human === 1 ? t("you") : t("computer")) : t("p1");
      $("#lo").textContent = ai ? (S.human === 2 ? t("you") : t("computer")) : t("p2");
    } else if (mode === "online" && NET.g && (NET.role === "guest" || NET.everJoined)) {
      const g = NET.g, mine = myMark(), host = NET.role === "host";
      scoreBlock.hidden = false;
      setSide($("#mx"), mine); setSide($("#mo"), 3 - mine);
      $("#sx").textContent = host ? g.score.host : g.score.guest;
      $("#so").textContent = host ? g.score.guest : g.score.host;
      $("#lx").textContent = t("you");
      $("#lo").textContent = NET.oppName || t("them");
      $("#draws").textContent = t("drawsOnline", g.score.d);
    } else {
      scoreBlock.hidden = true;
    }

    // online panel
    $("#onlinePanel").hidden = mode !== "online";
    const inGame = !!NET.role;
    $("#lobby").hidden = inGame;
    $("#ingame").hidden = !inGame;
    $("#inviteBox").hidden = NET.role !== "host";
    if (NET.role === "host") $("#inviteLink").value = inviteLink();
    $("#leaveBtn").textContent = NET.role === "host" ? t("endGame") : t("leaveGame");
    $("#againBtn").hidden = !(inGame && NET.g && NET.connected && isOver());
    const line = $("#connLine");
    if (inGame && (NET.everJoined || NET.role === "guest")) {
      line.innerHTML = `<span class="dot${NET.connected ? " on" : ""}"></span>`;
      line.append(NET.connected ? t("connectedTo", NET.oppName || t("opp")) : t("notConnected"));
      line.hidden = false;
    } else line.hidden = true;

    // message panel
    $("#msgPanel").hidden = mode !== "msg";
    $("#sendBox").hidden = !S.msg.waiting;
    $("#sendCode").value = msgShare();

    // settings and buttons
    $("#sideSet").hidden = mode !== "ai";
    $("#sizeSet").disabled = mode === "online" && inGame;
    $("#newBtn").hidden = !(local || mode === "msg");
    $("#newBtn").textContent = mode === "msg" ? t("startOver") : t("newGame");
    $("#undoBtn").hidden = !(local || mode === "msg");
    $("#undoBtn").disabled = !canUndo();
    $("#resetBtn").hidden = !local;
    $("#settingsNote").textContent = mode === "online" ? t("noteOnline") : t("noteOther");

    document.querySelector(`input[name=mode][value="${mode}"]`).checked = true;
    document.querySelector(`input[name=human][value="${S.human}"]`).checked = true;
    document.querySelector(`input[name=size][value="${S.size}"]`).checked = true;
  }
  function updateFocus(move) {
    cells.forEach((b, i) => { b.tabIndex = i === focusIdx ? 0 : -1; });
    if (move && cells[focusIdx]) cells[focusIdx].focus();
  }

  // ---------- events ----------
  boardEl.addEventListener("click", e => {
    const b = e.target.closest(".cell");
    if (b) handleCell(+b.dataset.r, +b.dataset.c);
  });
  boardEl.addEventListener("focusin", e => {
    const b = e.target.closest(".cell");
    if (!b) return;
    const idx = +b.dataset.r * S.N + +b.dataset.c;
    if (idx !== focusIdx) { focusIdx = idx; updateFocus(false); }
  });
  boardEl.addEventListener("keydown", e => {
    const N = S.N;
    let r = Math.floor(focusIdx / N), c = focusIdx % N;
    switch (e.key) {
      case "ArrowUp": r--; break;
      case "ArrowDown": r++; break;
      case "ArrowLeft": c--; break;
      case "ArrowRight": c++; break;
      case "Home": c = 0; break;
      case "End": c = N - 1; break;
      default: return;
    }
    e.preventDefault();
    r = Math.max(0, Math.min(N - 1, r)); c = Math.max(0, Math.min(N - 1, c));
    focusIdx = r * N + c;
    updateFocus(true);
  });

  document.querySelectorAll("input[name=mode]").forEach(i => i.addEventListener("change", () => setMode(i.value)));
  document.querySelectorAll("input[name=human]").forEach(i => i.addEventListener("change", () => { S.human = +i.value; save(); newLocalGame(); }));
  document.querySelectorAll("input[name=size]").forEach(i => i.addEventListener("change", () => {
    S.size = +i.value; save();
    if (S.mode === "ai" || S.mode === "pvp") newLocalGame();
    else if (S.mode === "msg") msgStartOver();
    else if (!NET.role) { S.N = S.size; S.moves = []; recompute(); render(); }
    else renderUI();
  }));
  $("#newBtn").addEventListener("click", () => { if (S.mode === "msg") msgStartOver(); else newLocalGame(); });
  $("#undoBtn").addEventListener("click", undo);
  $("#resetBtn").addEventListener("click", () => { S.score = { 1: 0, 2: 0, d: 0 }; save(); renderUI(); });

  $("#inviteBtn").addEventListener("click", () => hostStart(null));
  $("#shareBtn").addEventListener("click", () => shareOrCopy(t("shareInvite"), inviteLink(), $("#inviteLink"), onNote));
  $("#leaveBtn").addEventListener("click", () => { leaveOnline(true); setNote(onNote, ""); renderUI(); });
  $("#againBtn").addEventListener("click", playAgain);
  let nameTimer = null;
  $("#myName").addEventListener("input", () => {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => {
      lsSet(K.name, myName());
      if (NET.role === "host") sendState();
      else if (NET.conn && NET.connected) { try { NET.conn.send({ t: "name", name: myName() }); } catch (e) {} }
    }, 600);
  });

  $("#copyCodeBtn").addEventListener("click", () => {
    if (IS_WEB) shareOrCopy(t("shareMove"), msgShare(), $("#sendCode"), msgNote);
    else shareOrCopy(`${t("shareMove")} ${msgShare()}`, null, $("#sendCode"), msgNote);
  });
  $("#loadBtn").addEventListener("click", () => loadMsgText($("#pasteCode").value));
  $("#pasteCode").addEventListener("keydown", e => { if (e.key === "Enter") loadMsgText($("#pasteCode").value); });

  if ("ResizeObserver" in window) new ResizeObserver(sizeBoard).observe(page);
  window.addEventListener("resize", sizeBoard);

  // ---------- start ----------
  function handleHash() {
    const hash = location.hash || "";
    const joinMatch = /^#join-([a-z2-9]{6})$/i.exec(hash);
    const moveMatch = /^#move-(15|19)-([a-s]*)$/i.exec(hash);
    if (joinMatch) {
      const code = joinMatch[1].toLowerCase();
      if (NET.role === "guest" && NET.code === code) return true;
      if (S.mode !== "online") { clearTimeout(aiTimer); aiTimer = null; S.mode = "online"; save(); }
      let saved = null;
      try { saved = JSON.parse(lsGet(K.host) || "null"); } catch (e) {}
      if (saved && saved.code === code) {          // the host tapped their own link
        setHash("");
        if (!(NET.role === "host" && NET.code === code)) hostStart(saved); else renderUI();
      } else guestStart(code);
      return true;
    }
    if (moveMatch) {
      if (S.mode === "online") leaveOnline(false);
      clearTimeout(aiTimer); aiTimer = null;
      S.mode = "msg"; save();
      enterMsg();
      loadMsgText(hash);
      setHash("");
      return true;
    }
    return false;
  }
  window.addEventListener("hashchange", handleHash);

  function detectLang() {
    const saved = lsGet(K.lang);
    if (saved === "en" || saved === "hu") return saved;
    const first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    return /^hu\b/i.test(first) ? "hu" : "en";
  }
  function applyLang() {
    document.documentElement.lang = LANG;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
    cells.forEach(b => {
      const r = +b.dataset.r, c = +b.dataset.c;
      b.setAttribute("aria-label", cellLabel(r, c, board[r] ? board[r][c] : 0));
    });
    [onNote, msgNote].forEach(el => { if (el._note) el.textContent = el._note.key ? t(el._note.key, ...el._note.args) : ""; });
    renderUI();
  }
  document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => {
    LANG = b.dataset.lang;
    lsSet(K.lang, LANG);
    applyLang();
  }));

  load();
  LANG = detectLang();
  if (!handleHash()) {
    if (S.mode === "ai" || S.mode === "pvp") newLocalGame();
    else if (S.mode === "msg") enterMsg();
    else enterOnline();
  }
  applyLang();
})();
</script>
</body>
</html>
